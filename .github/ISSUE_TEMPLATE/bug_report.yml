name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go through private reporting instead
        (Security → Report a vulnerability), never a public issue.
        Please remove passwords, tokens, public IPs and hostnames from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. config.yaml with …
        2. docker compose up
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `framescout version --json` or the image tag.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - daemon / pipeline
        - source plugin
        - detector plugin
        - sink plugin
        - operator UI
        - CLI
        - inference server / trainer / studio (Python)
        - docs
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and config (redacted)
      render: shell
