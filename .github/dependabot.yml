# Dependency updates for every ecosystem in the repo. Minor and patch updates
# are grouped per ecosystem so a week produces a handful of PRs, not dozens;
# majors arrive one by one. Security updates are not affected by these limits.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # studio's browser UI has its own npm lockfile outside the pnpm workspace.
  - package-ecosystem: npm
    directory: /studio/web-src
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories: [/training, /services/inference-server, /studio]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /services/inference-server]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
