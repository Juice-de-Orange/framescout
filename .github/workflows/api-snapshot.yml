name: api-snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/plugin-api/**'
      - '.github/workflows/api-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: api-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: api-extractor shape check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.2
          run_install: false
          standalone: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin-api
        run: pnpm -F @framescout/plugin-api build

      - name: Compare api snapshot
        # `api-extractor run` (no --local) fails if the committed snapshot
        # at etc/plugin-api.api.md disagrees with the freshly generated
        # one. Any unintended public-surface change blocks the PR.
        run: pnpm -F @framescout/plugin-api api-extractor:check
