name: bridge-substitution

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/sink-http-multipart/**'
      - 'packages/core/src/pipeline/**'
      - 'packages/source-reolink-hub/**'
      - 'apps/daemon/**'
      - 'tests/fixtures/reolink-2026-04/**'
      - '.github/workflows/bridge-substitution.yml'
      - 'scripts/bridge-substitution-check.ts'
  push:
    branches: [main]
    paths:
      - 'tests/fixtures/reolink-2026-04/**'

permissions:
  contents: read

concurrency:
  group: bridge-sub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Bridge-substitution gate (V0.1-SCOPE §6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.2
          run_install: false
          standalone: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run bridge-substitution gate
        run: pnpm tsx scripts/bridge-substitution-check.ts
