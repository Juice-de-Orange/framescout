name: release

on:
  push:
    branches: [main]

# release-please commits release PRs back to main; cosign/npm provenance
# requires id-token write; package writes are for ghcr.io image push.
permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      daemon_release_created: ${{ steps.release.outputs['apps/daemon--release_created'] }}
      daemon_tag_name: ${{ steps.release.outputs['apps/daemon--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.1.2
          run_install: false
          standalone: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish released packages
        # `--report-summary` writes pnpm-publish-summary.json; combined with
        # the manifest-mode release-please, only packages whose version
        # bumped this release are published. The `--no-git-checks` lets
        # publish work from the post-release commit on `main`.
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r publish --access public --no-git-checks --report-summary

  publish-container:
    name: publish container image
    needs: release-please
    if: ${{ needs.release-please.outputs.daemon_release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/framescout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          tag='${{ needs.release-please.outputs.daemon_tag_name }}'
          version="${tag##*v}"
          major="${version%%.*}"
          minor="${version#*.}"; minor="${minor%.*}"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v$version"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$major.$minor"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$major"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push (linux/amd64,linux/arm64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image (keyless via OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # shellcheck disable=SC2034
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<EOF
          ${{ steps.tags.outputs.tags }}
          EOF

      - name: Generate SBOM (SPDX + CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.tags.outputs.version }}
          format: spdx-json
          upload-release-assets: false
          upload-artifact: true
          artifact-name: framescout-sbom-spdx-${{ steps.tags.outputs.version }}.spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.tags.outputs.version }}
          format: cyclonedx-json
          upload-release-assets: false
          upload-artifact: true
          artifact-name: framescout-sbom-cyclonedx-${{ steps.tags.outputs.version }}.cdx.json
