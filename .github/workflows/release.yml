name: release

on:
  push:
    branches: [main]

# release-please commits release PRs back to main; cosign/npm provenance
# requires id-token write; package writes are for ghcr.io image push.
permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      daemon_release_created: ${{ steps.release.outputs['apps/daemon--release_created'] }}
      daemon_tag_name: ${{ steps.release.outputs['apps/daemon--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.2
          run_install: false
          standalone: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish released packages
        # `--report-summary` writes pnpm-publish-summary.json; combined with
        # the manifest-mode release-please, only packages whose version
        # bumped this release are published. The `--no-git-checks` lets
        # publish work from the post-release commit on `main`.
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r publish --access public --no-git-checks --report-summary

  publish-container:
    name: publish container image
    needs: release-please
    if: ${{ needs.release-please.outputs.daemon_release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/framescout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          tag='${{ needs.release-please.outputs.daemon_tag_name }}'
          version="${tag##*v}"
          major="${version%%.*}"
          minor="${version#*.}"; minor="${minor%.*}"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v$version"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$major.$minor"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$major"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push (linux/amd64,linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless via OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # shellcheck disable=SC2034
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<EOF
          ${{ steps.tags.outputs.tags }}
          EOF

      - name: Generate SBOM (SPDX + CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.tags.outputs.version }}
          format: spdx-json
          upload-release-assets: false
          upload-artifact: true
          artifact-name: framescout-sbom-spdx-${{ steps.tags.outputs.version }}.spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.tags.outputs.version }}
          format: cyclonedx-json
          upload-release-assets: false
          upload-artifact: true
          artifact-name: framescout-sbom-cyclonedx-${{ steps.tags.outputs.version }}.cdx.json
