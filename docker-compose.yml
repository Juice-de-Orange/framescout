# Local-dev composition. Builds the daemon from source; from the first
# release on, the published image is
# `ghcr.io/juice-de-orange/framescout:v0.2.x`. `network_mode: host` is required so the daemon can poll
# Reolink hubs on the same LAN without explicit port mapping.

services:
  framescout:
    build: .
    image: framescout:dev
    container_name: framescout
    restart: unless-stopped
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      # Read-only: the operator UI can validate the config but not save it
      # (423 config_readonly). docs/operator-ui.md shows the writable variant.
      - ./config.yaml:/app/config.yaml:ro
      # Named volume: Docker creates it owned by the image user (uid 1001).
      # A bind mount would need `mkdir data && sudo chown 1001:1001 data` first.
      - framescout-data:/var/lib/framescout
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  framescout-data:
