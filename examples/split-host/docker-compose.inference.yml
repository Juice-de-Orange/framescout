# Runs on the inference host (a CPU-only VPS, always on). The heavy inference services:
#   - inference-server : your fine-tuned classifier (species + embedding)
#   - megadetector     : localisation + the person class for the privacy
#                        gate — NOT part of Framescout, bring your own
#                        (see the commented block at the bottom)
# Both CPU. Port 8001/8002 are reached from the daemon host over the network — put
# them behind a firewall / tailnet; the API keys are the only auth.
services:
  inference-server:
    build: ../../services/inference-server
    image: framescout-inference:latest
    container_name: framescout-inference
    restart: unless-stopped
    environment:
      MODEL_PATH: /models/model.onnx
      LABELS_PATH: /models/labels.json
      # Pin the trained model's SHA so a corrupt/again-wrong file fails fast.
      MODEL_SHA256: ${CLASSIFY_MODEL_SHA256:-}
      API_KEY: ${CLASSIFY_API_KEY:?set CLASSIFY_API_KEY}
      INPUT_SIZE: "224"
    ports:
      - "8002:8002"
    volumes:
      # Drop model.onnx + labels.json here (rsync from the training PC,
      # or fetch the pinned registry artefact).
      - ./models:/models:ro

  # ── PLACEHOLDER — bring your own MegaDetector HTTP service ─────────
  # Framescout does not ship or publish a MegaDetector image. Build your
  # own wrapper that speaks the contract in
  # docs/detectors/megadetector-http.md (POST /detect, multipart `image`),
  # put its image name below and uncomment the block. Until you do, remove
  # the `megadetector` detector from config.daemon.yaml or every event
  # ends without detections.
  #
  # megadetector:
  #   image: <your-megadetector-http-image>
  #   restart: unless-stopped
  #   environment:
  #     API_KEY: ${MEGADETECTOR_API_KEY:?set MEGADETECTOR_API_KEY}
  #   ports:
  #     - "8001:8001"
