packages:
  - 'packages/*'
  - 'apps/*'
  - 'tests/e2e/fixtures/*'

# esbuild's postinstall script is intentionally NOT run: modern esbuild
# (>=0.17) ships the platform binary via @esbuild/<platform> optional
# subdeps, so vitest works without the legacy postinstall download.
# Explicit `false` silences the `pnpm approve-builds` prompt.
allowBuilds:
  esbuild: false
  # sharp's install script downloads platform-specific libvips binaries.
  # Required — the JS layer doesn't work without them.
  sharp: true
  # onnxruntime-node's install script downloads platform binaries
  # (CPU EP for linux/x64 + linux/arm64). Required for the
  # @framescout/detector-individual-embed plugin.
  onnxruntime-node: true

# Lift transitive advisories. Every target stays inside the range of its
# parent package, so there is no compatibility risk. Since pnpm 10 overrides
# live here, not in package.json. On the next larger upgrade, check whether
# each entry is still needed: remove it, `pnpm install`,
# `pnpm audit --audit-level=low`.
overrides:
  adm-zip: '^0.6.1'
  ws: '^8.21.1'
  postcss: '^8.5.18'
  svgo: '^4.1.0'
  js-yaml: '^4.3.2'
  # eslint 10 left minimatch@3 behind; every minimatch in the tree is now 10.x,
  # which needs the 5.x API, so one global target fits all.
  brace-expansion: '^5.0.8'
  fast-uri: '^3.1.7'
  devalue: '^5.9.3'
  esbuild: '^0.28.1'
  # vitest 4 bundles vite 8, and the docs site runs on vite 8 since the
  # Astro 7 upgrade, so a global override is safe.
  vite: '^8.0.16'
  # via sink-mqtt > aedes > hyperid
  uuid: '^11.1.1'
  # via eslint-plugin-react-hooks
  '@babel/core': '^7.29.6'
  # Minimum patched versions for advisories published after 2026-10-01 (pnpm audit).
  'browserslist@<4.28.7': '^4.28.7'
  'ip-address@<10.3.1': '^10.3.1'
  'nanoid@<3.3.18': '^3.3.18'
  'sharp@<0.35.4': '^0.35.4'
  'smol-toml@<1.7.1': '^1.7.1'
  # monaco-editor 0.57.0 pins dompurify exactly. The editor bundles its own
  # vendored copy (vs/base/browser/dompurify), so this only moves the declared
  # dependency; the advisories need IN_PLACE, which monaco never sets.
  'dompurify@<3.4.16': '^3.4.16'
