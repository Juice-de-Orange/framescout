# Minimal config for E2E tests.
#
# The stub source emits a handful of synthetic CaptureEvents on
# daemon start so the live-observation spec can assert the SSE stream
# delivers observations to the UI within a few seconds. No detectors
# (so isBlank=true) and emitBlankObservations is on so every event
# still produces a media-level Observation.

framescout:
  dataDir: /tmp/framescout-e2e
  metricsPort: 0   # the playwright config overrides this at boot via env

deployments:
  - id: e2e
    cameras:
      - id: cam-e2e

sources:
  - id: stub
    # __STUB_PACKAGE__ is replaced by playwright.config.ts with an
    # absolute path to the built source-stub plugin dir, so the
    # daemon's createRequire-based resolver finds it without needing
    # `@framescout-e2e/source-stub` in `apps/daemon/package.json`.
    package: '__STUB_PACKAGE__'
    emitBlankObservations: true
    topNFrames: 1
    config:
      deploymentId: e2e
      cameraId: cam-e2e
      count: 5
      intervalMs: 400

detectors: []
sinks: []
