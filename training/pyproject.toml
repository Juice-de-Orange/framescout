[project]
name = "framescout-trainer"
version = "0.1.0"
description = "Offline trainer for the Framescout custom species + individual-embedding classifier. Fine-tunes a timm backbone on your labelled images and exports a two-output ONNX (embedding + logits) for services/inference-server."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Core deps are torch-free so `framescout_trainer.preprocess` (shared
# with the studio) installs lightly. The actual training/export needs
# the GPU stack — `pip install -e .[train]` (install the CUDA torch
# build per https://pytorch.org for your CUDA version).
dependencies = [
    "onnx==1.17.0",
    "onnxruntime==1.20.1",
    "pillow==11.1.0",
    "numpy==2.2.1",
]

[project.optional-dependencies]
train = ["torch>=2.6.0,<3", "timm==1.0.12"]
dev = ["pytest==8.3.4", "ruff==0.8.4", "mypy==1.14.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["framescout_trainer"]

[tool.ruff]
line-length = 100
